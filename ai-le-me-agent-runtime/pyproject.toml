[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-le-me-agent-runtime"
version = "0.1.0"
description = "Standalone Python agent runtime for AiLeMe social companion and persona intelligence."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Codex" }
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0.39,<3.0",
  "pymysql>=1.1.1,<2.0",
  "httpx>=0.28,<1.0",
  "python-dotenv>=1.1,<2.0",
  "llama-index-core>=0.12,<1.0",
  "langgraph>=1.1,<2.0",
  "chromadb>=1.5,<2.0",
  "neo4j>=6.0,<7.0",
  "mem0ai>=1.0,<2.0",
  "letta-client>=1.8,<2.0",
  "graphiti-core>=0.28,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_runtime*"]

[tool.pytest.ini_options]
pythonpath = ["."]
