# =====================================================
# AI人物画像配置示例
# =====================================================

# AI提供商选择: mock(测试) / tongyi(通义千问) / zhipu(智谱GLM)
ai.persona.provider=mock

# ---------- 通义千问配置 ----------
# 获取地址: https://dashscope.console.aliyun.com/apiKey
ai.tongyi.api-key=your-tongyi-api-key-here
ai.tongyi.model=qwen-turbo

# ---------- 智谱GLM配置 ----------
# 获取地址: https://open.bigmodel.cn/usercenter/apikeys
ai.zhipu.api-key=your-zhipu-api-key-here
ai.zhipu.model=glm-4

# ---------- 画像生成费用配置 ----------
# 这些配置也可以从数据库persona_config表读取
persona.generate.cost.integral=100
persona.generate.cost.vip-free-monthly=3
persona.view.cost.integral=50
